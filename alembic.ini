[alembic]
# Path to migration scripts
script_location = backend/alembic
# Database URL (placeholder, will be overridden by env variable in app)
sqlalchemy.url = sqlite+aiosqlite:///./ai_fabric.db

[log]
level = INFO
handlers = console

[handlers]
keys = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
